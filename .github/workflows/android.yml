
name: Build and Release NothingTweaks

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g., 2.8)"
        required: true
        default: "2.8"
        type: string
      release:
        description: "Publish a GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build, Verify & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/nothingtweaks-release.jks"

          if [ ! -s "$RUNNER_TEMP/nothingtweaks-release.jks" ]; then
            echo "::error::Keystore file is empty"
            exit 1
          fi

          chmod 600 "$RUNNER_TEMP/nothingtweaks-release.jks"
          echo "Release keystore decoded."

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nothingtweaks-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Locate Release APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          APKS=(app/build/outputs/apk/release/*.apk)

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#APKS[@]}"
            exit 1
          fi

          echo "apk_path=${APKS[0]}" >> "$GITHUB_OUTPUT"
          echo "Found APK: ${APKS[0]}"

      - name: Verify APK Signature
        env:
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path not found"
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_PATH"

          echo "APK signature verification passed."
          echo ""
          echo "Signing certificate details:"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Prepare Release Asset
        id: release_asset
        env:
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          ASSET="release-assets/NothingTweaks-v${VERSION_NAME}-release.apk"

          cp "$APK_PATH" "$ASSET"
          echo "apk_path=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET"

      - name: Calculate APK SHA-256
        id: apk_hash
        env:
          APK_PATH: ${{ steps.release_asset.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail

          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          printf '%s  %s\n' "$SHA256" "$(basename "$APK_PATH")" \
            > "${APK_PATH}.sha256"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "        NOTHINGTWEAKS APK VERIFICATION"
          echo "=========================================="
          echo "APK: $APK_PATH"
          echo "SHA-256:"
          echo "$SHA256"
          echo "=========================================="
          echo ""

      - name: Generate Build Metadata
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          APK_SHA256: ${{ steps.apk_hash.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MESSAGE="$(git log -1 --format=%s "$COMMIT_SHA")"
          COMMIT_AUTHOR="$(git log -1 --format=%an "$COMMIT_SHA")"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "# NothingTweaks v${VERSION_NAME}"
            echo ""
            echo "## Build Information"
            echo "- Built by: GitHub Actions"
            echo "- Source repository: https://github.com/${REPOSITORY}"
            echo "- Source commit: [\`${SHORT_SHA}\`](https://github.com/${REPOSITORY}/commit/${COMMIT_SHA})"
            echo "- Commit message: ${COMMIT_MESSAGE}"
            echo "- Commit author: ${COMMIT_AUTHOR}"
            echo "- Build time: ${BUILD_DATE}"
            echo "- Workflow triggered by: ${ACTOR}"
            echo "- [View GitHub Actions build](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})"
            echo ""
            echo "## Verification"
            echo "- APK signature verification passed."
            echo "- SHA-256 checksum file is attached."
            echo "- GitHub Actions build provenance attestation is generated."
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo ""
            echo "## Installation and Updates"
            echo "- Install the APK using Android's package installer."
            echo "- Updates require the same compatible signing key and a higher versionCode."
          } > release-notes.md

      - name: Attest APK Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.release_asset.outputs.apk_path }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NothingTweaks-v${{ inputs.version_name }}-release
          path: |
            ${{ steps.release_asset.outputs.apk_path }}
            ${{ steps.release_asset.outputs.apk_path }}.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.release_asset.outputs.apk_path }}
            ${{ steps.release_asset.outputs.apk_path }}.sha256
          name: NothingTweaks v${{ inputs.version_name }}
          tag_name: v${{ inputs.version_name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Temporary Keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/nothingtweaks-release.jks"
